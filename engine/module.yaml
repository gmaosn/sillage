# The engine: scenes, nodes, players, cameras, the interface, models, textures — the same code on every
# platform — and under it one backend per platform (windows, drawing, sound, pads).
product:
  type: kmp/lib
  platforms: [jvm, wasmJs]

settings:
  kotlin:
    freeCompilerArgs:
      - -Xexpect-actual-classes
  jvm:
    jdk:
      version: 25

settings@jvm:
  kotlin:
    freeCompilerArgs:
      - -Xexpect-actual-classes
      - -Xadd-modules=jdk.incubator.vector
      - -Xno-call-assertions
      - -Xno-receiver-assertions
      - -Xno-param-assertions
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
        - --add-modules=jdk.incubator.vector

dependencies:
  - //core: exported
